# 非密钥配置（可进 git）。密钥只放 .env
paths:
  sqlite_path: data/ai_hot.db
  digest_path: out/digest.md
  digest_zh_path: out/digest.zh.md
  speak_en_path: out/speak.md
  speak_zh_path: out/speak.zh.md
  speak_audio_dir: out/audio
  content_audio_dir: content/audio
  content_digests_dir: content/digests
  arena_cache_dir: content/arena
  site_output_dir: public

# 口播 TTS（edge-tts）；python -m src.speak（默认中英）；--lang zh|en 只跑一侧
speak:
  voice: zh-CN-YunxiNeural
  voice_en: en-US-JennyNeural
  rate: "+0%"

# 静态站 / PartnerStack：开联盟后 Disclosure 写佣金说明；owner/contact 务必填真名与邮箱
site:
  affiliate_enabled: true
  owner_name: "Tony"  # TODO: 填真实姓名或品牌名（About 页展示）
  contact_email: "tonysingwm@gmail.com"  # TODO: 填可公开联系邮箱（About / Privacy）
  base_url: https://ai-hot.tonysingwm.workers.dev

# Arena 独立页：构建时拉取指定榜（社区日更镜像）
leaderboard:
  enabled: true
  base_url: https://api.wulong.dev/arena-ai-leaderboards/v1/leaderboard
  github_raw_base: https://raw.githubusercontent.com/oolong-tea-2026/arena-ai-leaderboards/main/data
  source_base: https://arena.ai/leaderboard
  boards:
    - agent
    - text-to-image
    - text-to-video
    - image-edit
    - image-to-video
    - video-edit
  top_n: 10
  timeout_seconds: 20
  request_gap_seconds: 0.4
  agent_score_name: Net Improvement

hn:
  enabled: true
  top_n: 30
  min_score: 100
  min_comments: 20

rss:
  max_new_per_feed: 5
  feeds:
    - name: openai
      url: https://openai.com/news/rss.xml
    # YouTube 长视频：每频道只取最新 1 条；已见跳过；排除 Shorts
    - name: openai_youtube
      url: https://www.youtube.com/feeds/videos.xml?channel_id=UCXZCJLdBC09xxGZ6gcdrc6A
      max_new: 1
      exclude_url_contains:
        - /shorts/
      tag: video
    # Claude (@claude)
    - name: claude_youtube
      url: https://www.youtube.com/feeds/videos.xml?channel_id=UCV03SRZXJEz-hchIAogeJOg
      max_new: 1
      exclude_url_contains:
        - /shorts/
      tag: video
    # Grok (@Grok)
    - name: grok_youtube
      url: https://www.youtube.com/feeds/videos.xml?channel_id=UCxgo0OMZU9SiaYpJsuZKWkQ
      max_new: 1
      exclude_url_contains:
        - /shorts/
      tag: video
    - name: google_ai
      url: https://blog.google/innovation-and-ai/technology/ai/rss/
    - name: deepmind
      url: https://deepmind.google/blog/rss.xml
    # Anthropic 无官方 RSS；使用社区维护镜像，可随时在本文件替换
    - name: anthropic
      url: https://raw.githubusercontent.com/taobojlen/anthropic-rss-feed/main/anthropic_news_rss.xml
    - name: huggingface
      url: https://huggingface.co/blog/feed.xml
    # NVIDIA：Newsroom「AI Platforms / Deployment」（避免 blogs 全站混入游戏）
    - name: nvidia_ai
      url: https://nvidianews.nvidia.com/cats/ai_platforms_deployment.xml
    # Apple：发布会 / 新闻稿
    - name: apple_newsroom
      url: https://www.apple.com/newsroom/rss-feed.rss
    # Apple ML Research（论文）
    - name: apple_ml
      url: https://machinelearning.apple.com/rss.xml
      tag: paper
    # 中国 AI：量子位 + 关键词白名单（未命中不入选）
    - name: qbitai
      url: https://www.qbitai.com/feed
      keywords:
        - MiniMax
        - 海螺
        - Seedance
        - Seed
        - 即梦
        - 豆包
        - 字节
        - 月之暗面
        - Kimi
        - 智谱
        - GLM
        - 通义
        - 千问
        - Qwen
        - 文心
        - 快手
        - 可灵
        - 商汤
        - 百川
        - DeepSeek
        - 深度求索
        - 阶跃
        - StepFun
        - 零一万物
        - 面壁
        - 昆仑万维
        - 腾讯混元
        - 混元
        - 阿里
        - 华为盘古
        - 盘古
        - 讯飞
        - 星火

filter:
  cooldown_hours: 24

http:
  timeout_seconds: 30
  user_agent: ai_hot/0.1 (+local; personal hotspot monitor)

ollama:
  base_url: http://127.0.0.1:11434
  model: qwen3.5:9b
  timeout_seconds: 600
  translate_batch_size: 8
  # 摘要/翻译够用；过大（如 65536）会把 KV cache 撑到十余 GB
  num_ctx: 8192
  # 关掉 Qwen3.5 thinking，否则摘要极慢且可能空 content
  think: false

# 默认 LLM；Grok/云端可设 LLM_PROVIDER=openrouter + OPENROUTER_API_KEY
llm:
  provider: ollama  # ollama | openrouter

openrouter:
  base_url: https://openrouter.ai/api/v1
  # 钉死稳定 free；失败再试 openrouter/free 一次（见 fallback_model）
  model: inclusionai/ling-3.0-flash-vl:free
  fallback_model: openrouter/free
  timeout_seconds: 120
  app_title: ai_hot
