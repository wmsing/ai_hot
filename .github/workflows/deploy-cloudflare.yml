name: Deploy Cloudflare Worker

# 项目已停更：push 自动部署已关闭，仅手动 workflow_dispatch。
on:
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Build static site
        run: python -m src.site_build --content-only

      - name: Verify hot page matches content
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          import yaml

          cfg = yaml.safe_load(Path("config.yaml").read_text(encoding="utf-8"))
          if not (cfg.get("site") or {}).get("hot_page_enabled", False):
              print("hot page verify skipped: site.hot_page_enabled is false")
              raise SystemExit(0)

          data = json.loads(Path("content/hot_topics/latest.json").read_text(encoding="utf-8"))
          zh = Path("public/zh/hot.html").read_text(encoding="utf-8")
          items = data.get("items") or []
          if not items:
              print("hot page verify skipped: empty snapshot")
              raise SystemExit(0)
          first = items[0]
          title_zh = (first.get("title_zh") or "").strip()
          if title_zh and title_zh not in zh:
              print(f"missing title_zh in zh/hot.html: {title_zh[:120]}")
              raise SystemExit(1)
          summary_zh = (first.get("summary_zh") or "").strip()
          if summary_zh and summary_zh not in zh:
              print("missing summary_zh in zh/hot.html")
              raise SystemExit(1)
          print("hot page verify ok")
          PY

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
